<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>跳转中...</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{width:100vw;height:100vh;overflow:hidden}
        .browser-tip{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.8);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:9999;
            color:#fff;
            padding:20px
        }
        .tip-image{
            position:absolute;
            top:20px;
            right:20px;
            width:80px;
            height:80px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        /* 关键修复：使用!important确保样式生效，增加特异性 */
        .tip-image .arrow-icon {
            font-size: 56px !important;
            color: #ffffff !important;
            opacity: 1 !important;
            width: auto;
            height: auto;
        }
        .browser-tip h2{
            font-size:24px;
            margin-bottom:20px;
            text-align:center
        }
        .browser-tip p{
            font-size:18px;
            max-width:80%;
            margin:0 auto;
            line-height:1.6;
            text-align:center
        }
    </style>
</head>
<body>
    <div class="browser-tip" id="browserTip" style="display:none">
        <div class="tip-image">
            <i class="fa fa-external-link arrow-icon" aria-hidden="true"></i>
        </div>
        <h2>请在外部浏览器中打开</h2>
        <p>当前页面在QQ/微信中可能无法正常显示，请点击右上角<br>选择"在浏览器中打开"</p>
    </div>

    <script>
        !function(){
            const u = navigator.userAgent.toLowerCase();
            const isWechatOrQQ = /micromessenger|qq\//.test(u);
            
            function loadFontAwesome() {
                return new Promise((resolve) => {
                    if (document.querySelector('link[href*="font-awesome"]')) {
                        resolve();
                        return;
                    }
                    
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = 'https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css';
                    link.crossOrigin = 'anonymous';
                    
                    // 加载完成后强制刷新图标样式
                    link.onload = function() {
                        const icon = document.querySelector('.arrow-icon');
                        if (icon) {
                            // 强制用强制重绘技巧确保样式生效
                            icon.style.display = 'none';
                            setTimeout(() => {
                                icon.style.display = 'inline-block';
                            }, 0);
                        }
                        resolve();
                    };
                    
                    link.onerror = resolve;
                    document.head.appendChild(link);
                });
            }
            
            if (isWechatOrQQ) {
                loadFontAwesome().then(() => {
                    const tip = document.getElementById('browserTip');
                    tip.style.display = 'flex';
                    // 显示后再次确认图标大小
                    setTimeout(() => {
                        const icon = document.querySelector('.arrow-icon');
                        if (icon) {
                            icon.style.fontSize = '56px';
                        }
                    }, 100);
                });
                return;
            }
            
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|HarmonyOS/i.test(u);
            let t = isMobile ? 'templates/page.html' : 'https://www.baidu.com';
            isMobile && (t += (t.includes('?') ? '&' : '?') + `t=${+new Date()}`);
            location.href = t;
        }();
    </script>
</body>
</html>
