<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中</title>
    <style>
        /* 提示框样式 */
        .browser-tip {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* 右上角图标容器 */
        .tip-image {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .tip-image i {
            font-size: 40px;
            color: #fff;
        }
        
        .browser-tip h2 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .browser-tip p {
            font-size: 18px;
            max-width: 80%;
            margin: 0 auto;
            line-height: 1.6;
            text-align: center;
        }
    </style>
    <!-- 引入Font Awesome用于显示图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- 提示框，默认隐藏 -->
    <div class="browser-tip" id="browserTip" style="display: none;">
        <div class="tip-image">
            <i class="fas fa-external-link-alt"></i>
        </div>
        <h2>请在外部浏览器中打开</h2>
        <p>当前页面在QQ/微信中可能无法正常显示，请点击右上角<br>选择"在浏览器中打开"</p>
    </div>

    <script>
        (function () {
            // 判断是否在QQ或微信内置浏览器中
            const userAgent = navigator.userAgent.toLowerCase();
            const isWeChat = /micromessenger/.test(userAgent);
            const isQQ = /qq\//.test(userAgent);
            
            // 如果是QQ或微信，显示提示信息
            if (isWeChat || isQQ) {
                document.getElementById('browserTip').style.display = 'flex';
                return; // 终止后续执行
            }
            
            // 设备类型判断并跳转
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|HarmonyOS/i.test(userAgent);
            let targetUrl = isMobile
                ? `templates/page.html`
                : 'https://www.baidu.com';

            // 仅为移动端URL添加时间戳参数，防止缓存
            if (isMobile) {
                const timestamp = new Date().getTime();
                // 检查URL是否已有查询参数，决定用?还是&连接
                targetUrl += (targetUrl.includes('?') ? '&' : '?') + `timestamp=${timestamp}`;
            }

            // 立即跳转，不添加任何动画延迟
            window.location.href = targetUrl;
        })();
    </script>
</body>

</html>
