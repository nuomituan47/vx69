<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>欢迎回家</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #1a2232;
            --bg-secondary: rgba(36, 46, 68, 0.85);
            --bg-accent: rgba(50, 60, 84, 0.65);
            --text-primary: #f5f8fc;
            --text-secondary: #b3c0d6;
            --text-tertiary: rgba(179, 192, 214, 0.75);
            --tab-subtext-gray: #8a94a6;
            --accent: #a97fff;
            --accent-hover: #c29bfe;
            --accent-glow: rgba(169, 127, 255, 0.6);
            --warning: #f9c25e;
            --success: #48ddb0;
            --border-radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
            --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(169, 127, 255, 0.14) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(92, 165, 254, 0.14) 0%, transparent 50%);
            z-index: -1;
        }

        .alert-bar {
            background: linear-gradient(90deg, var(--warning), #fed779);
            color: #1e293b;
            text-align: center;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 12px rgba(249, 194, 94, 0.4);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .alert-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin: 15px 0 25px;
            width: 100%;
            position: relative;
        }

        .title-container {
            margin-bottom: 8px;
            position: relative;
            display: inline-block;
        }

        .title-line:first-child {
            font-size: 1.3rem;
            margin-bottom: 5px;
            font-weight: 700;
            background: linear-gradient(90deg, #ff6666, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255, 102, 102, 0.6);
        }

        .title-line:last-child {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--accent), #ccb0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
            font-weight: 800;
            letter-spacing: -0.5px;
            position: relative;
            display: inline-block;
        }

        .title-line:last-child::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 25%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 3px;
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 500px;
        }

        .nav-link {
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--border-radius);
            padding: 14px 20px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            width: 100%;
            z-index: 1;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(169, 127, 255, 0.14), rgba(92, 165, 254, 0.14));
            opacity: 0;
            transition: var(--transition);
            z-index: -1;
        }

        .nav-link:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: var(--shadow-hover);
        }

        .nav-link:hover::before {
            opacity: 1;
        }

        .icon-container {
            width: 40px;
            display: flex;
            justify-content: center;
            margin-right: 12px;
        }

        .nav-link .icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
            transition: color 0.3s ease, filter 0.3s ease;
        }

        .nav-link:hover .icon {
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
        }

        .nav-text {
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .nav-main-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.2;
            transition: text-shadow 0.3s ease;
        }

        .nav-link:hover .nav-main-text {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .nav-sub-text {
            font-size: 0.75rem;
            margin-top: 3px;
            line-height: 1.2;
            transition: color 0.3s ease;
            color: var(--tab-subtext-gray) !important;
        }

        .status-tag {
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .status-tag.available {
            background: rgba(72, 221, 176, 0.2);
            color: var(--success);
        }
        .status-tag.maintenance {
            background: rgba(249, 194, 94, 0.2);
            color: var(--warning);
        }
        .status-tag.error {
            background: rgba(255, 99, 132, 0.2);
            color: #ff6384;
        }

        .status-bar {
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 8px 12px;
            margin-top: auto;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .status-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), #ccb0ff);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .status-title {
            text-align: center;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 500;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-title i {
            margin: 0 6px;
            color: var(--accent);
            font-size: 0.85rem;
        }

        .status-item {
            margin-bottom: 6px;
            width: 100%;
        }

        .status-item:last-child {
            margin-bottom: 2px;
        }

        .status-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            font-size: 0.8rem;
            width: 100%;
            font-weight: 400;
        }

        .progress-container {
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
            width: 100%;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(90deg, var(--accent), #ccb0ff);
            position: relative;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background-image: linear-gradient(-45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent);
            background-size: 6px 6px;
            animation: move 1s linear infinite;
        }

        @keyframes move {
            0% { background-position: 0 0; }
            100% { background-position: 6px 0; }
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-element {
            position: absolute;
            background: rgba(169, 127, 255, 0.06);
            border-radius: 50%;
            animation: float 20s infinite linear;
            box-shadow: 0 0 40px rgba(169, 127, 255, 0.12);
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(169, 127, 255, 0.35);
            border-radius: 50%;
            animation: particle-float 15s infinite linear;
        }

        @keyframes particle-float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
        }

        .empty-fill {
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }
        
        .empty-line {
            height: 20px;
            width: 100%;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .loading-message {
            display: none;
        }

        .loading-message.error {
            display: block;
            color: #ff6384;
            padding: 15px;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 768px) {
            .container { padding: 10px; }
            .title-line:last-child { font-size: 1.8rem; }
            .title-line:first-child { font-size: 1.1rem; }
            .nav-link { padding: 12px 15px; }
            .nav-main-text { font-size: 1rem; }
            .nav-sub-text { font-size: 0.7rem; }
            .icon-container { width: 36px; }
        }

        @media (max-width: 480px) {
            .title-line:last-child { font-size: 1.6rem; }
            .title-line:first-child { font-size: 1rem; }
            .nav-link { padding: 10px; }
            .nav-main-text { font-size: 0.95rem; }
            .nav-sub-text { font-size: 0.65rem; }
            .empty-line { height: 16px; margin-bottom: 8px; }
            .icon-container { width: 32px; }
        }
    </style>
</head>

<body>
    <div class="floating-elements">
        <div class="floating-element" style="width: 120px; height: 120px; top: 10%; left: 5%; animation-duration: 25s;"></div>
        <div class="floating-element" style="width: 180px; height: 180px; top: 60%; right: 10%; animation-duration: 30s;"></div>
        <div class="floating-element" style="width: 100px; height: 100px; bottom: 20%; left: 15%; animation-duration: 22s;"></div>
    </div>

    <div class="particles" id="particles-container"></div>

    <div class="alert-bar">
        <i class="fas fa-exclamation-circle"></i> 如支付成功后无法观看，尝试重新进入通道点已购观看
    </div>

    <div class="container">
        <header>
            <div class="title-container">
                <div class="title-line">收藏网址 永不失联</div>
                <div class="title-line" id="dynamic-title">加载中...</div>
            </div>
        </header>

        <div class="nav-container" id="nav-container">
        </div>
    </div>

    <div class="status-bar">
        <div class="status-title">
            <i class="fas fa-chart-line"></i> 系统状态 <i class="fas fa-chart-line"></i>
        </div>

        <div class="status-item">
            <div class="status-label">
                <span><i class="fas fa-users"></i> 在线人数</span>
                <span id="online-count">0</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="online-progress" style="width: 0%"></div>
            </div>
        </div>

        <div class="status-item">
            <div class="status-label">
                <span><i class="fas fa-server"></i> 系统负载</span>
                <span id="load-percent">0.00%</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="load-progress" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="empty-fill">
        <div class="empty-line"></div>
        <div class="empty-line"></div>
    </div>

    <script>
        function setDynamicTitle() {
            const titleElement = document.getElementById('dynamic-title');
            titleElement.textContent = window.location.hostname;
        }

        function getTrulyUniqueColors(count) {
            const baseColors = [
                '#FF6B8B', '#6B8BFF', '#6BFFD1', '#FFD16B', '#B86BFF',
                '#FF8B6B', '#6BFF8B', '#8B6BFF', '#6BD1FF', '#FF6BD1',
                '#8BFF6B', '#D16BFF', '#6BFFB8', '#FFB86B', '#6B8BFF',
                '#FFD18B', '#8BD1FF', '#D18BFF', '#8BFFD1', '#FF6BD1',
                '#6BFF8B', '#FF8BD1', '#8B6BFF', '#D1FF6B', '#6BD1FF'
            ];
            
            function varyColor(color, variation) {
                let r = parseInt(color.substring(1, 3), 16);
                let g = parseInt(color.substring(3, 5), 16);
                let b = parseInt(color.substring(5, 7), 16);
                
                const change = 15 * (variation + 1);
                r = Math.max(50, Math.min(255, r + (variation % 2 === 0 ? change : -change)));
                g = Math.max(50, Math.min(255, g + (variation % 3 === 0 ? change : -change)));
                b = Math.max(50, Math.min(255, b + (variation % 5 === 0 ? change : -change)));
                
                return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase()}`;
            }
            
            const uniqueColors = [];
            let variation = 0;
            
            while (uniqueColors.length < count) {
                const baseColor = baseColors[uniqueColors.length % baseColors.length];
                const newColor = varyColor(baseColor, variation);
                
                if (!uniqueColors.includes(newColor)) {
                    uniqueColors.push(newColor);
                }
                
                variation++;
            }
            
            return uniqueColors;
        }

        const UNIQUE_VIDEO_ICONS = [
            'fa-film', 'fa-tv', 'fa-video', 'fa-play-circle', 'fa-clapperboard',
            'fa-circle-play', 'fa-star', 'fa-crown', 'fa-globe', 'fa-bolt',
            'fa-shield-alt', 'fa-cloud', 'fa-rocket', 'fa-play', 'fa-pause-circle',
            'fa-stop-circle', 'fa-step-forward', 'fa-step-backward', 'fa-fast-forward',
            'fa-fast-backward', 'fa-volume-up', 'fa-fullscreen', 'fa-compress', 'fa-list',
            'fa-th-large', 'fa-check-circle', 'fa-clock', 'fa-download', 'fa-theater-masks',
            'fa-tv-retro'
        ];

        async function loadAndGenerateChannels() {
            const navContainer = document.getElementById('nav-container');
            
            try {
                const filePath = 'channels.txt';
                const response = await fetch(filePath);
                
                if (!response.ok) {
                    throw new Error(`无法加载文件: ${response.statusText}`);
                }
                
                const content = await response.text();
                const lines = content.split('\n');
                const channels = [];
                
                lines.forEach(line => {
                    if (!line.trim()) return;
                    
                    const parts = line.split(',').map(part => part.trim());
                    if (parts.length === 2) {
                        const [id, url] = parts;
                        channels.push({ id, url });
                    }
                });
                
                if (channels.length === 0) {
                    navContainer.innerHTML = '<div class="loading-message error">未找到可用的观影通道</div>';
                    return;
                }
                
                const uniqueColors = getTrulyUniqueColors(channels.length);
                
                const descriptions = [
                    '高清画质，适合大多数设备',
                    '备用线路，支持多清晰度切换',
                    '蓝光专区，适合高端设备播放',
                    '海外线路，适合境外用户访问',
                    'VIP专享，无广告，极速加载',
                    '全球线路，覆盖范围广',
                    '高速线路，加载速度快',
                    '加密线路，隐私保护',
                    '云加速线路，流畅播放',
                    '极速专线，超高清体验',
                    '缓存通道，支持离线观看',
                    '多设备同步，跨端播放',
                    '无广告纯净版，沉浸式体验',
                    '1080P专区，高清首选',
                    '4K超高清，高端设备适配'
                ];
                
                navContainer.innerHTML = '';
                
                channels.forEach((channel, index) => {
                    const { id, url } = channel;
                    const uniqueColor = uniqueColors[index];
                    const uniqueIcon = UNIQUE_VIDEO_ICONS[index % UNIQUE_VIDEO_ICONS.length];
                    const description = descriptions[index % descriptions.length];
                    
                    const linkElement = document.createElement('a');
                    linkElement.href = url;
                    linkElement.className = 'nav-link';
                    linkElement.target = '_blank';
                    linkElement.setAttribute('data-channel', id);
                    
                    linkElement.innerHTML = `
                        <div class="icon-container">
                            <span class="icon" style="color: ${uniqueColor}"><i class="fas ${uniqueIcon}"></i></span>
                        </div>
                        <div class="nav-text">
                            <div class="nav-main-text" style="color: ${uniqueColor}">观影通道${id}</div>
                            <div class="nav-sub-text">${description}</div>
                        </div>
                        <span class="status-tag available">可用</span>
                    `;
                    
                    const glowColor = uniqueColor + '40';
                    linkElement.addEventListener('mouseenter', () => {
                        linkElement.style.boxShadow = `var(--shadow-hover), 0 0 20px ${glowColor}`;
                        linkElement.style.borderColor = uniqueColor;
                    });
                    
                    linkElement.addEventListener('mouseleave', () => {
                        linkElement.style.boxShadow = 'var(--shadow)';
                        linkElement.style.borderColor = 'rgba(255, 255, 255, 0.15)';
                    });
                    
                    navContainer.appendChild(linkElement);
                });
                
            } catch (error) {
                console.error('加载通道失败:', error);
                navContainer.innerHTML = `<div class="loading-message error">加载通道失败: ${error.message}</div>`;
            }
        }

        function getPercentageRangeByTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const timeOfDay = hours + minutes / 60 + seconds / 3600;

            let min, max;

            if (timeOfDay >= 6 && timeOfDay < 24) {
                const percentage = 5 + (timeOfDay - 6) * (80 / 18);
                min = Math.max(5, percentage - 5);
                max = Math.min(85, percentage + 5);
            } else if (timeOfDay >= 0 && timeOfDay < 1) {
                min = 80;
                max = 95;
            } else {
                const percentage = 90 - (timeOfDay - 1) * (85 / 5);
                min = Math.max(5, percentage - 5);
                max = Math.min(90, percentage + 5);
            }

            return { min, max };
        }

        function getRandomFloat(min, max) {
            return parseFloat((Math.random() * (max - min) + min).toFixed(2));
        }

        function updateStatus() {
            const { min, max } = getPercentageRangeByTime();

            const onlinePercentage = getRandomFloat(min, max);

            const loadMin = Math.max(min, onlinePercentage - 0.25);
            const loadMax = Math.min(max, onlinePercentage + 0.25);
            const loadPercentage = getRandomFloat(loadMin, loadMax);

            const maxUsers = 50000;
            const onlineCount = Math.floor((onlinePercentage / 100) * maxUsers);

            document.getElementById('online-count').textContent = onlineCount.toLocaleString();
            document.getElementById('online-progress').style.width = onlinePercentage + '%';
            document.getElementById('load-percent').textContent = loadPercentage + '%';
            document.getElementById('load-progress').style.width = loadPercentage + '%';
        }

        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = window.innerWidth <= 480 ? 15 : 30;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 4 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(particle);
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            setDynamicTitle();
            loadAndGenerateChannels();
            updateStatus();
            createParticles();

            setInterval(updateStatus, 5 * 1000);

            const floatingContainer = document.querySelector('.floating-elements');
            for (let i = 0; i < 5; i++) {
                const element = document.createElement('div');
                element.classList.add('floating-element');
                const size = Math.random() * 100 + 60;
                element.style.width = `${size}px`;
                element.style.height = `${size}px`;
                element.style.top = `${Math.random() * 100}%`;
                element.style.left = `${Math.random() * 100}%`;
                element.style.animationDuration = `${Math.random() * 15 + 15}s`;
                floatingContainer.appendChild(element);
            }
        });
    </script>
</body>

</html>
