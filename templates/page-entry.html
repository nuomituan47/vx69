<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 整体亮度提升10%的颜色配置 */
            --bg-primary: #1a2232;
            --bg-secondary: rgba(36, 46, 68, 0.85);
            --bg-accent: rgba(50, 60, 84, 0.65);
            --text-primary: #f5f8fc;
            --text-secondary: #b3c0d6;
            --text-tertiary: rgba(179, 192, 214, 0.75);
            --accent: #a97fff;
            --accent-hover: #c29bfe;
            --accent-glow: rgba(169, 127, 255, 0.6);
            --warning: #f9c25e;
            --success: #48ddb0;
            --border-radius: 12px;
            /* 略微减小圆角 */
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
            /* 减小阴影 */
            --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景装饰渐变 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(169, 127, 255, 0.14) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(92, 165, 254, 0.14) 0%, transparent 50%);
            z-index: -1;
        }

        /* 顶部警告栏 - 高度减小 */
        .alert-bar {
            background: linear-gradient(90deg, var(--warning), #fed779);
            color: #1e293b;
            text-align: center;
            padding: 8px 12px;
            /* 减少内边距 */
            font-size: 13px;
            /* 减小字体 */
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 12px rgba(249, 194, 94, 0.4);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .alert-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        /* 主容器 */
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            /* 减少内边距 */
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 页面标题 - 减少整体高度 */
        header {
            text-align: center;
            margin: 15px 0 25px;
            /* 大幅减少上下间距 */
            width: 100%;
            position: relative;
        }

        .title-container {
            margin-bottom: 8px;
            /* 减少底部间距 */
            position: relative;
            display: inline-block;
        }

        .title-line:first-child {
            font-size: 1.3rem;
            /* 减小字体 */
            margin-bottom: 5px;
            /* 减少底部间距 */
            font-weight: 700;
            background: linear-gradient(90deg, #ff6666, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255, 102, 102, 0.6);
        }

        .title-line:last-child {
            font-size: 2.2rem;
            /* 减小字体 */
            background: linear-gradient(135deg, var(--accent), #ccb0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
            font-weight: 800;
            letter-spacing: -0.5px;
            position: relative;
            display: inline-block;
        }

        .title-line:last-child::after {
            content: '';
            position: absolute;
            bottom: -6px;
            /* 减少距离 */
            left: 25%;
            width: 50%;
            height: 2px;
            /* 减小高度 */
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 3px;
        }

        /* 导航容器 - 减少间距 */
        .nav-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            /* 减少按钮之间的间距 */
            margin-bottom: 25px;
            /* 减少底部距离 */
            width: 100%;
            max-width: 500px;
        }

        /* 导航按钮 - 更紧凑的设计 */
        .nav-link {
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--border-radius);
            padding: 14px 20px;
            /* 减少内边距 */
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            /* 减小字体 */
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            width: 100%;
            text-align: center;
            z-index: 1;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(169, 127, 255, 0.14), rgba(92, 165, 254, 0.14));
            opacity: 0;
            transition: var(--transition);
            z-index: -1;
        }

        .nav-link:hover {
            transform: translateY(-3px) scale(1.01);
            /* 减小悬停效果 */
            box-shadow: var(--shadow-hover), 0 0 20px var(--accent-glow);
            border-color: var(--accent);
        }

        .nav-link:hover::before {
            opacity: 1;
        }

        .nav-link .icon {
            margin-right: 12px;
            /* 减少图标与文字间距 */
            font-size: 1.4rem;
            /* 减小图标 */
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
            color: var(--accent);
            transition: color 0.3s ease;
        }

        .nav-link:hover .icon {
            color: var(--accent-hover);
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        /* 每个导航图标颜色区分 */
        .nav-link:nth-child(1) .icon {
            color: #a97fff;
        }

        .nav-link:nth-child(2) .icon {
            color: #8aa6f5;
        }

        .nav-link:nth-child(3) .icon {
            color: #788bff;
        }

        .nav-link:nth-child(4) .icon {
            color: #a06bff;
        }

        .nav-link:nth-child(5) .icon {
            color: #c08bff;
        }

        /* 状态标签样式 */
        .status-tag {
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        .status-tag.available {
            background: rgba(72, 221, 176, 0.2);

        }
        .status-tag.maintenance {
            background: rgba(249, 194, 94, 0.2);
            color: var(--warning);
        }

        /* 底部系统状态栏 - 更紧凑 */
        .status-bar {
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: 15px;
            /* 减少内边距 */
            margin-top: auto;
            margin-bottom: 15px;
            /* 增加底部小间距 */
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.15);

            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;

        }

        .status-bar::before {
            content: '';

            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            /* 减小高度 */
            background: linear-gradient(90deg, var(--accent), #ccb0ff);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .status-title {
            text-align: center;
            margin-bottom: 12px;
            /* 减少底部间距 */
            font-size: 1.1rem;
            /* 减小字体 */
            color: var(--text-primary);
            font-weight: 600;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-title i {

            color: var(--accent);
            font-size: 1rem;
            /* 减小图标 */
        }

        .status-item {
            margin-bottom: 12px;
            /* 减少项目间距 */
            width: 100%;
        }

        .status-item:last-child {
            margin-bottom: 0;
            /* 最后一项无间距 */
        }

        .status-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            /* 减少标签与进度条间距 */
            font-size: 0.9rem;
            /* 减小字体 */
            width: 100%;
            font-weight: 500;
        }

        .progress-container {
            height: 8px;
            /* 减小进度条高度 */
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
            width: 100%;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(90deg, var(--accent), #ccb0ff);
            position: relative;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background-image: linear-gradient(-45deg, rgba(255, 255, 255, 0.2) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0.2) 75%, transparent 75%, transparent);
            background-size: 8px 8px;
            /* 减小图案尺寸 */
            animation: move 1s linear infinite;
        }

        @keyframes move {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 8px 0;
            }
        }

        /* 浮动装饰元素 */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-element {
            position: absolute;
            background: rgba(169, 127, 255, 0.06);
            border-radius: 50%;
            animation: float 20s infinite linear;
            box-shadow: 0 0 40px rgba(169, 127, 255, 0.12);
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-30px) rotate(180deg);
            }

            100% {
                transform: translateY(0) rotate(360deg);
            }
        }

        /* 粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(169, 127, 255, 0.35);
            border-radius: 50%;
            animation: particle-float 15s infinite linear;
        }

        @keyframes particle-float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        /* 底部空白信息填充区 */
        .empty-fill {
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }
        
        .empty-line {
            height: 20px;
            width: 100%;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        /* 响应式适配 - 保持紧凑 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .title-line:last-child {
                font-size: 1.8rem;
            }

            .title-line:first-child {
                font-size: 1.1rem;
            }

            .nav-link {
                padding: 12px 15px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .title-line:last-child {
                font-size: 1.6rem;
            }

            .title-line:first-child {
                font-size: 1rem;
            }

            .nav-link {
                padding: 10px;
                font-size: 0.95rem;
            }

            .status-bar {
                padding: 12px 10px;
            }
            
            .empty-line {
                height: 16px;
                margin-bottom: 8px;
            }
        }
    </style>
</head>

    <script>
        // 根据当前时间获取负载和在线人数的百分比范围
        function getPercentageRangeByTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // 精确到秒的时间计算
            const timeOfDay = hours + minutes / 60 + seconds / 3600;

            let min, max;

            if (timeOfDay >= 6 && timeOfDay < 24) {
                // 早上6点到午夜24点：5%到85%逐渐增加，范围±5%
                const percentage = 5 + (timeOfDay - 6) * (80 / 18);
                min = Math.max(5, percentage - 5);
                max = Math.min(85, percentage + 5);
            } else if (timeOfDay >= 0 && timeOfDay < 1) {
                // 午夜0点到凌晨1点：80%到95%
                min = 80;
                max = 95;
            } else {
                // 凌晨1点到6点：90%下降到5%，范围±5%
                const percentage = 90 - (timeOfDay - 1) * (85 / 5);
                min = Math.max(5, percentage - 5);
                max = Math.min(90, percentage + 5);
            }

            return { min, max };
        }

        // 生成指定范围内的随机小数，保留两位小数
        function getRandomFloat(min, max) {
            return parseFloat((Math.random() * (max - min) + min).toFixed(2));
        }

        // 更新系统状态
        function updateStatus() {
            const { min, max } = getPercentageRangeByTime();

            // 生成在线人数百分比
            const onlinePercentage = getRandomFloat(min, max);

            // 生成系统负载百分比（与在线人数接近）
            const loadMin = Math.max(min, onlinePercentage - 0.25);
            const loadMax = Math.min(max, onlinePercentage + 0.25);
            const loadPercentage = getRandomFloat(loadMin, loadMax);

            // 计算在线人数（最大50000人）
            const maxUsers = 50000;
            const onlineCount = Math.floor((onlinePercentage / 100) * maxUsers);

            // 更新DOM
            document.getElementById('online-count').textContent = onlineCount.toLocaleString();
            document.getElementById('online-progress').style.width = onlinePercentage + '%';
            document.getElementById('load-percent').textContent = loadPercentage + '%';
            document.getElementById('load-progress').style.width = loadPercentage + '%';
        }

        // 创建粒子效果
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = window.innerWidth <= 480 ? 15 : 30;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 4 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(particle);
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function () {
            updateStatus();
            createParticles();

            // 每30秒更新一次状态
            setInterval(updateStatus, 30 * 1000);

            // 添加更多浮动元素
            const floatingContainer = document.querySelector('.floating-elements');
            for (let i = 0; i < 5; i++) {
                const element = document.createElement('div');
                element.classList.add('floating-element');
                const size = Math.random() * 100 + 60;
                element.style.width = `${size}px`;
                element.style.height = `${size}px`;
                element.style.top = `${Math.random() * 100}%`;
                element.style.left = `${Math.random() * 100}%`;
                element.style.animationDuration = `${Math.random() * 15 + 15}s`;
                floatingContainer.appendChild(element);
            }
        });
    </script>
