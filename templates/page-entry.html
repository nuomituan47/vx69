<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎回家</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 仅保留暗色模式颜色配置 */
        :root {
            --bg-primary: #1a2232;
            --bg-secondary: rgba(36, 46, 68, 0.85);
            --bg-accent: rgba(50, 60, 84, 0.65);
            --text-primary: #f5f8fc;
            --text-secondary: #b3c0d6;
            --text-tertiary: rgba(179, 192, 214, 0.75);
            /* 统一的灰色小字颜色 */
            --tab-subtext-gray: #8a94a6;
            --accent: #a97fff;
            --accent-hover: #c29bfe;
            --accent-glow: rgba(169, 127, 255, 0.6);
            --warning: #f9c25e;
            --success: #48ddb0;
            
            /* 通道颜色（仅用于图标和主文字） */
            --channel1-color: #a97fff;
            --channel2-color: #6fc4ff;
            --channel3-color: #78e08f;
            --channel4-color: #ffb677;
            --channel5-color: #ff8fa3;
            
            --border-radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
            --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景装饰渐变 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(169, 127, 255, 0.14) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(92, 165, 254, 0.14) 0%, transparent 50%);
            z-index: -1;
        }

        /* 顶部警告栏 */
        .alert-bar {
            background: linear-gradient(90deg, var(--warning), #fed779);
            color: #1e293b;
            text-align: center;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 12px rgba(249, 194, 94, 0.4);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .alert-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* 主容器 */
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 页面标题 */
        header {
            text-align: center;
            margin: 15px 0 25px;
            width: 100%;
            position: relative;
        }

        .title-container {
            margin-bottom: 8px;
            position: relative;
            display: inline-block;
        }

        .title-line:first-child {
            font-size: 1.3rem;
            margin-bottom: 5px;
            font-weight: 700;
            background: linear-gradient(90deg, #ff6666, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255, 102, 102, 0.6);
        }

        .title-line:last-child {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--accent), #ccb0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
            font-weight: 800;
            letter-spacing: -0.5px;
            position: relative;
            display: inline-block;
        }

        .title-line:last-child::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 25%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 3px;
        }

        /* 导航容器 */
        .nav-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 500px;
        }

        /* 导航按钮 - 支持两行文字 */
        .nav-link {
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--border-radius);
            padding: 14px 20px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            width: 100%;
            z-index: 1;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(169, 127, 255, 0.14), rgba(92, 165, 254, 0.14));
            opacity: 0;
            transition: var(--transition);
            z-index: -1;
        }

        .nav-link:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: var(--shadow-hover);
        }

        .nav-link:hover::before {
            opacity: 1;
        }

        /* 统一所有图标的宽度和对齐方式 */
        .icon-container {
            width: 40px; /* 固定宽度，确保所有图标对齐 */
            display: flex;
            justify-content: center;
            margin-right: 12px;
        }

        .nav-link .icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
            transition: color 0.3s ease, filter 0.3s ease;
        }

        .nav-link:hover .icon {
            filter: drop-shadow(0 0 10px rgba(169, 127, 255, 0.6));
        }

        /* 导航链接文本容器 - 支持两行文字 */
        .nav-text {
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .nav-main-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.2;
            transition: text-shadow 0.3s ease;
        }

        .nav-link:hover .nav-main-text {
            text-shadow: 0 0 8px rgba(169, 127, 255, 0.4);
        }

        /* 统一所有通道的小字为灰色 */
        .nav-sub-text {
            font-size: 0.75rem;
            margin-top: 3px;
            line-height: 1.2;
            transition: color 0.3s ease;
            color: var(--tab-subtext-gray) !important; /* 强制统一为灰色，优先级最高 */
        }

        /* 为每个通道设置不同的颜色（仅图标和主文字） */
        .nav-link:nth-child(1) .icon,
        .nav-link:nth-child(1) .nav-main-text {
            color: var(--channel1-color);
        }
        .nav-link:nth-child(1):hover {
            border-color: var(--channel1-color);
            box-shadow: var(--shadow-hover), 0 0 20px rgba(169, 127, 255, 0.4);
        }

        .nav-link:nth-child(2) .icon,
        .nav-link:nth-child(2) .nav-main-text {
            color: var(--channel2-color);
        }
        .nav-link:nth-child(2):hover {
            border-color: var(--channel2-color);
            box-shadow: var(--shadow-hover), 0 0 20px rgba(111, 196, 255, 0.4);
        }

        .nav-link:nth-child(3) .icon,
        .nav-link:nth-child(3) .nav-main-text {
            color: var(--channel3-color);
        }
        .nav-link:nth-child(3):hover {
            border-color: var(--channel3-color);
            box-shadow: var(--shadow-hover), 0 0 20px rgba(120, 224, 143, 0.4);
        }

        .nav-link:nth-child(4) .icon,
        .nav-link:nth-child(4) .nav-main-text {
            color: var(--channel4-color);
        }
        .nav-link:nth-child(4):hover {
            border-color: var(--channel4-color);
            box-shadow: var(--shadow-hover), 0 0 20px rgba(255, 182, 119, 0.4);
        }

        .nav-link:nth-child(5) .icon,
        .nav-link:nth-child(5) .nav-main-text {
            color: var(--channel5-color);
        }
        .nav-link:nth-child(5):hover {
            border-color: var(--channel5-color);
            box-shadow: var(--shadow-hover), 0 0 20px rgba(255, 143, 163, 0.4);

            flex-shrink: 0;

        /* 底部系统状态栏 - 紧凑版 */

            left: 0;

        .status-title {
            text-align: center;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 500;
            width: 100%;

            justify-content: center;
        }

        .status-title i {

            color: var(--accent);
            font-size: 0.85rem;
        }

        .status-item {
            margin-bottom: 6px;
            width: 100%;
        }

        .status-item:last-child {
            margin-bottom: 2px;
        }

        .status-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            font-size: 0.8rem;
            width: 100%;
            font-weight: 400;
        }

        .progress-container {
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
            width: 100%;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(90deg, var(--accent), #ccb0ff);
            position: relative;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background-image: linear-gradient(-45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent);
            background-size: 6px 6px;
            animation: move 1s linear infinite;
        }

        @keyframes move {
            0% { background-position: 0 0; }
            100% { background-position: 6px 0; }
        }

        /* 浮动装饰元素 */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-element {
            position: absolute;
            background: rgba(169, 127, 255, 0.06);
            border-radius: 50%;
            animation: float 20s infinite linear;
            box-shadow: 0 0 40px rgba(169, 127, 255, 0.12);
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        /* 粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(169, 127, 255, 0.35);
            border-radius: 50%;
            animation: particle-float 15s infinite linear;
        }

        @keyframes particle-float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
        }

        /* 底部空白信息填充区 */
        .empty-fill {
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }
        
        .empty-line {
            height: 20px;
            width: 100%;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .title-line:last-child { font-size: 1.8rem; }
            .title-line:first-child { font-size: 1.1rem; }
            .nav-link { padding: 12px 15px; }
            .nav-main-text { font-size: 1rem; }
            .nav-sub-text { font-size: 0.7rem; }
            .icon-container { width: 36px; }
        }

        @media (max-width: 480px) {
            .title-line:last-child { font-size: 1.6rem; }
            .title-line:first-child { font-size: 1rem; }
            .nav-link { padding: 10px; }
            .nav-main-text { font-size: 0.95rem; }
            .nav-sub-text { font-size: 0.65rem; }
            .empty-line { height: 16px; margin-bottom: 8px; }
            .icon-container { width: 32px; }
        }
    </style>
</head>

    <script>
        // 根据当前时间获取负载和在线人数的百分比范围
        function getPercentageRangeByTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // 精确到秒的时间计算
            const timeOfDay = hours + minutes / 60 + seconds / 3600;

            let min, max;

            if (timeOfDay >= 6 && timeOfDay < 24) {
                // 早上6点到午夜24点：5%到85%逐渐增加，范围±5%
                const percentage = 5 + (timeOfDay - 6) * (80 / 18);
                min = Math.max(5, percentage - 5);
                max = Math.min(85, percentage + 5);
            } else if (timeOfDay >= 0 && timeOfDay < 1) {
                // 午夜0点到凌晨1点：80%到95%
                min = 80;
                max = 95;
            } else {
                // 凌晨1点到6点：90%下降到5%，范围±5%
                const percentage = 90 - (timeOfDay - 1) * (85 / 5);
                min = Math.max(5, percentage - 5);
                max = Math.min(90, percentage + 5);
            }

            return { min, max };
        }

        // 生成指定范围内的随机小数，保留两位小数
        function getRandomFloat(min, max) {
            return parseFloat((Math.random() * (max - min) + min).toFixed(2));
        }

        // 更新系统状态
        function updateStatus() {
            const { min, max } = getPercentageRangeByTime();

            // 生成在线人数百分比
            const onlinePercentage = getRandomFloat(min, max);

            // 生成系统负载百分比（与在线人数接近）
            const loadMin = Math.max(min, onlinePercentage - 0.25);
            const loadMax = Math.min(max, onlinePercentage + 0.25);
            const loadPercentage = getRandomFloat(loadMin, loadMax);

            // 计算在线人数（最大50000人）
            const maxUsers = 50000;
            const onlineCount = Math.floor((onlinePercentage / 100) * maxUsers);

            // 更新DOM
            document.getElementById('online-count').textContent = onlineCount.toLocaleString();
            document.getElementById('online-progress').style.width = onlinePercentage + '%';
            document.getElementById('load-percent').textContent = loadPercentage + '%';
            document.getElementById('load-progress').style.width = loadPercentage + '%';
        }

        // 创建粒子效果
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = window.innerWidth <= 480 ? 15 : 30;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 4 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(particle);
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function () {
            updateStatus();
            createParticles();

            // 每5秒更新一次状态
            setInterval(updateStatus, 5 * 1000);

            // 添加更多浮动元素
            const floatingContainer = document.querySelector('.floating-elements');
            for (let i = 0; i < 5; i++) {
                const element = document.createElement('div');
                element.classList.add('floating-element');
                const size = Math.random() * 100 + 60;
                element.style.width = `${size}px`;
                element.style.height = `${size}px`;
                element.style.top = `${Math.random() * 100}%`;
                element.style.left = `${Math.random() * 100}%`;
                element.style.animationDuration = `${Math.random() * 15 + 15}s`;
                floatingContainer.appendChild(element);
            }
        });
    </script>
</body>

</html>
